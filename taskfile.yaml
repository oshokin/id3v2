version: "3"

silent: true

vars:
  # -------------------------------
  # Platform Configuration
  # -------------------------------

  # Path separator per OS.
  PS: '{{fromSlash "/"}}'

  # Cross-platform mkdir/rm helpers.
  RMRF: '{{if eq OS "windows"}}powershell.exe -Command "Remove-Item -Force -Recurse -ErrorAction SilentlyContinue -Path{{else}}rm -rf{{end}}'
  RMRF_END: '{{if eq OS "windows"}}; exit 0"{{end}}'
  MKDIR: '{{if eq OS "windows"}}powershell.exe -Command "New-Item -ItemType Directory -Force -Path{{else}}mkdir -p{{end}}'
  MKDIR_END: '{{if eq OS "windows"}} | Out-Null"{{end}}'

  # -------------------------------
  # Project Directories
  # -------------------------------

  LOCAL_BIN: "{{.TASKFILE_DIR}}{{.PS}}bin"

  # -------------------------------
  # Tool Versions
  # -------------------------------

  # Compare short versions (2.13.2), install with a v-tag.
  GOLANGCI_VERSION: "2.13.2"
  GOLANGCI_TAG: "v{{.GOLANGCI_VERSION}}"

  # -------------------------------
  # Tool Binaries
  # -------------------------------

  GOLANGCI_BIN: "{{.LOCAL_BIN}}{{.PS}}golangci-lint{{exeExt}}"

  # -------------------------------
  # Version Detection
  # -------------------------------

  GOLANGCI_CURRENT_VERSION:
    sh: '"{{.GOLANGCI_BIN}}" version --short 2>/dev/null || true'

  # -------------------------------
  # Configuration Files
  # -------------------------------

  GOLANGCI_CONFIG: ".golangci.yaml"

tasks:
  # -------------------------------
  # Default
  # -------------------------------

  default:
    cmds:
      - task -l

  # -------------------------------
  # Tool Installation
  # -------------------------------

  _ensure-bin:
    internal: true
    cmds:
      - '{{.MKDIR}} ''{{.LOCAL_BIN}}''{{.MKDIR_END}}'

  install-lint:
    desc: "Install golangci-lint into ./bin"
    deps: [_ensure-bin]
    cmds:
      - |
        {{if (not (eq .GOLANGCI_CURRENT_VERSION .GOLANGCI_VERSION))}}
          echo "Installing golangci-lint {{.GOLANGCI_TAG}}..."
          {{if eq OS "windows"}}
            powershell.exe -Command "\$env:GOBIN = '{{.LOCAL_BIN}}'; go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_TAG}}"
          {{else}}
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_TAG}}
          {{end}}
        {{end}}
    env:
      GOBIN: "{{.LOCAL_BIN}}"

  # -------------------------------
  # Code Quality
  # -------------------------------

  lint-fix:
    desc: "Run golangci-lint with --fix"
    deps: [install-lint]
    cmds:
      - '"{{.GOLANGCI_BIN}}" config verify --config={{.GOLANGCI_CONFIG}}'
      - '"{{.GOLANGCI_BIN}}" run --fix --config={{.GOLANGCI_CONFIG}}'

  lint:
    desc: "Run golangci-lint"
    deps: [install-lint]
    cmds:
      - '"{{.GOLANGCI_BIN}}" config verify --config={{.GOLANGCI_CONFIG}}'
      - '"{{.GOLANGCI_BIN}}" run --config={{.GOLANGCI_CONFIG}}'

  tidy:
    desc: "Synchronize go.mod and go.sum"
    cmds:
      - go mod tidy

  # -------------------------------
  # Testing
  # -------------------------------

  test:
    desc: "Run tests"
    cmds:
      - go test -count=1 -v ./...

  test-race:
    desc: "Run tests with race detector"
    cmds:
      - |
        {{if eq OS "windows"}}
          echo "Note: Race detector requires CGO. If this fails, install gcc (MinGW-w64) or use WSL."
          powershell.exe -Command "\$env:CGO_ENABLED = '1'; go test -race -count=1 -v ./..."
        {{else}}
          go test -race -count=1 -v ./...
        {{end}}
    env:
      CGO_ENABLED: "1"

  bench:
    desc: "Run benchmarks with allocation statistics"
    cmds:
      - go test -run=^$ -bench=. -benchmem ./...

  # -------------------------------
  # Build
  # -------------------------------

  build:
    desc: "Build the project"
    deps: [_ensure-bin]
    cmds:
      - go build -v ./...

  release-check:
    desc: "Run module checks, lint, build, test and race tests"
    cmds:
      - go mod tidy -diff
      - go mod verify
      - task: lint
      - task: build
      - task: test
      - task: test-race

  # -------------------------------
  # Version Management
  # -------------------------------

  fetch-tags:
    desc: "Fetch tags from origin"
    cmds:
      - |
        echo "Fetching tags from origin..."
        git fetch --tags

  version-check:
    desc: "Show the next SemVer based on commits since the last tag"
    deps: [fetch-tags]
    cmds:
      - |
        echo "Analyzing commits for version bump..."
        {{if eq OS "windows"}}
          powershell -ExecutionPolicy Bypass -File scripts/semver_next.ps1
        {{else}}
          bash scripts/semver_next.sh
        {{end}}

